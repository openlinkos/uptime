# Change these first
owner: OpenLinkOS # Your GitHub organization or username, where this repository lives
repo: uptime # The name of this repository

sites:
  - name: LinkOS Docker Registry Mirror
    url: https://docker.linkos.org
  - name: LinkOS GCR Registry Mirror
    url: https://gcr.linkos.org
  - name: LinkOS GHCR Registry Mirror
    url: https://ghcr.linkos.org
  - name: LinkOS K8S Registry Mirror
    url: https://k8s.linkos.org
  - name: LinkOS Quay Registry Mirror
    url: https://quay.linkos.org

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: uptime.linkos.org
  # baseUrl: /your-repo-name
  logoUrl: https://openlinkos.com/brand/linkos-status/web/logo.svg
  favicon: https://openlinkos.com/brand/linkos-status/web/favicon.svg
  name: LinkOS Status
  introTitle: "**LinkOS** is the line of hosted services run by [OpenLinkOS](https://openlinkos.com)."
  introMessage: Free mirrors of public container registries for the cloud-native community, especially where network access to them is poor. This page shows their live status.
  navbar:
    - title: Status
      href: /
    - title: OpenLinkOS
      href: https://openlinkos.com
    - title: GitHub
      href: https://github.com/openlinkos

# Upptime also supports notifications, assigning issues, and more
