# LinkOS Status 的 Gatus 配置。GATUS_CONFIG_PATH 指向本目录，目录里所有 *.yaml 合并加载；
# 文件变化后 Gatus 自动重载，写错的配置会被忽略（skip-invalid-config-update），继续用上一份。
# 运行时的环境变量（部署时放在服务器上的 env 文件里，不进仓库）：
#   GITHUB_TOKEN  只能读写 openlinkos/uptime 的 issue，用于告警
#   PROBE_TOKEN   大陆检测点推送结果用的令牌

skip-invalid-config-update: true

# 计划内维护（迁移、升级、会中断服务的重启）。配置合入后约 5 分钟才生效，要提前合入：
#   - 公告：加顶层 announcements，状态页顶部显示。每条写 timestamp（UTC，RFC3339）、type、message（可用 Markdown）。
#     开始前用 information 写清时间和影响，结束后再加一条 operational，旧的那条设 archived: true（移到页面底部）。
#   - 不开告警 issue：加顶层 maintenance（start: "hh:mm"、duration、timezone: Asia/Shanghai、every: [当天是星期几]），用完删掉。
#     只能按每天或每周几的时段写，没有具体日期；而且它只是不开告警，检测结果照常记录，状态页上的红格不会消失。
#   例：
#     announcements:
#       - timestamp: 2026-11-01T14:00:00Z
#         type: information
#         message: "11 月 1 日 22:00–22:30（北京时间）维护镜像加速服务，期间可能短暂中断。"
#     maintenance:
#       start: "22:00"
#       duration: 30m
#       timezone: Asia/Shanghai
#       every: [Sunday]

web:
  port: 18443
  # 只给 CDN 回源用的自签证书，CDN 不校验源站证书，但回源这一段不走明文
  tls:
    certificate-file: /certs/origin.crt
    private-key-file: /certs/origin.key

storage:
  type: sqlite
  path: /data/gatus.db
  # 每项保留最近 1440 条结果（每分钟一条，约一天）和 200 次状态变化，默认只有 100 条和 50 次；可用率另有统计，不受这两个数影响
  maximum-number-of-results: 1440
  maximum-number-of-events: 200

ui:
  title: LinkOS Status
  description: Live status of the LinkOS services, checked from overseas and from mainland China. LinkOS 各项服务的实时状态，从海外和中国大陆同时检测。
  header: LinkOS Status
  login-subtitle: LinkOS 服务状态
  dashboard-heading: LinkOS 服务状态
  dashboard-subheading: 每分钟从洛杉矶和中国大陆两个检测点（上海 BGP、浙江电信）检测一次。只有大陆失败时，多半是大陆到服务的线路问题。Checked every minute from Los Angeles and from two probes in mainland China.
  logo: https://openlinkos.com/brand/linkos-status/web/logo.svg
  link: https://linkos.org
  # 三项都指向品牌的 favicon.ico（内含 16、32、48 三种尺寸）；只改 default 的话，浏览器会选 Gatus 自带的 16、32 尺寸图标
  favicon:
    default: https://openlinkos.com/brand/linkos-status/web/favicon.ico
    size16x16: https://openlinkos.com/brand/linkos-status/web/favicon.ico
    size32x32: https://openlinkos.com/brand/linkos-status/web/favicon.ico
  default-sort-by: group
  buttons:
    - name: LinkOS
      link: https://linkos.org/zh/
    - name: Mirrors
      link: https://linkos.org/zh/mirrors
    - name: Terms
      link: https://linkos.org/zh/terms
    - name: Incidents
      link: https://github.com/openlinkos/uptime/issues?q=is%3Aissue
    - name: GitHub
      link: https://github.com/openlinkos/uptime

# 故障时在 openlinkos/uptime 开 issue（标题以 alert(gatus): 开头），恢复后自动关闭
alerting:
  github:
    repository-url: https://github.com/openlinkos/uptime
    token: ${GITHUB_TOKEN}
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true
