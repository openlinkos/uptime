    alerts:
      - type: github

  - name: linkos.org
    group: 海外检测
    url: https://linkos.org/
    interval: 1m
    client:
      timeout: 20s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 10000"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: github

  - name: openlinkos.com
    group: 海外检测
    url: https://openlinkos.com/
    interval: 1m
