# Overseas - Los Angeles：由 Gatus 自己从洛杉矶检测，每分钟一次。
# Overseas - Los Angeles 组带告警：连续 3 次失败开 issue，连续 2 次成功后关闭；证书剩余不到 7 天也算失败。
# 检测都经过 CDN，CDN 节点的流量有限：只用 HEAD 取状态码，不下载正文；也不做拉取测试。
# 镜像网站在 CDN 上限制每个 IP 最多 4 个并发连接，所以镜像检测都带 Connection: close，不保留空闲连接。

endpoints:

  - name: docker.linkos.org
    group: Overseas - Los Angeles
    url: https://docker.linkos.org/healthz
    headers:
      Connection: "close"
    method: HEAD
    interval: 1m
    client:
      timeout: 20s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 10000"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: github

  - name: gcr.linkos.org
