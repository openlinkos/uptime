# 海外检测：由 Gatus 自己从洛杉矶检测，每分钟一次。
# 「海外检测」组带告警：连续 3 次失败开 issue，连续 2 次成功后关闭；证书剩余不到 7 天也算失败。
# 「拉取测试（海外）」组用 HEAD 请求每个上游的一个固定镜像（HEAD 不计入 Docker Hub 的拉取次数），
# 只在状态页显示，不开 issue，免得和 /healthz 重复告警。
# 镜像网站在 CDN 上限制每个 IP 最多 4 个并发连接，所以镜像检测都带 Connection: close，不保留空闲连接。

endpoints:

  - name: docker.linkos.org
    group: 海外检测
    url: https://docker.linkos.org/healthz
    headers:
      Connection: "close"
    interval: 1m
    client:
      timeout: 20s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 10000"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: github

  - name: gcr.linkos.org
    group: 海外检测
    url: https://gcr.linkos.org/healthz
    headers:
      Connection: "close"
    interval: 1m
    client:
      timeout: 20s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 10000"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: github

  - name: ghcr.linkos.org
